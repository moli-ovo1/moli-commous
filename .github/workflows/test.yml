name: Gate 1 contracts and PostgreSQL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: commons
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: commons_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U commons -d commons_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://commons:test_only@127.0.0.1:5432/commons_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
